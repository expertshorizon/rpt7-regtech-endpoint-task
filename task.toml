name = "rpt7-regtech-endpoint"
artifacts = ["/app/"]

[metadata]
author_name = "Horizon Experts"
author_email = "business@expertshorizon.com"
category = "Operations"
subcategory = "Compliance"
tags = ["regtech", "compliance", "wire-protocol", "sqlite", "http-service"]
languages = ["C", "Bash"]
difficulty = "advanced"
expert_time_estimate_hours = 5
relevant_experience = "Comfortable reading and debugging multi-file C services built with a plain Makefile, including manual socket/HTTP handling and SQLite access through the C API; familiar with financial or regulatory reporting rule engines where thresholds, exemptions, and jurisdiction-specific overrides interact; able to reason precisely about bitmask flags, fixed-point money in whole cents, and the difference between a filed rate and a binary floating-point approximation of it; comfortable sizing and indexing in-memory reference tables loaded from a database rather than assuming a compile-time bound."
difficulty_explanation = "The instructions state how an adjustment settles and in what order the two flags apply, but not the rule values themselves or which columns decide exemption and reportability. Instruction.md fixes the wire format, the response shape and the error behaviour, and names the reference database as the specification: its table definitions document the columns that feed a determination and how an adjusted threshold is arrived at, and accepted_fragments records the decoded values each bundled filing must produce. Recovering the thresholds, rates and exemption columns from that evidence is the task, and the decisive part of it is an error class that an agent's own verification actively certifies as correct. Adjustment rates are filed the way a rate schedule files them, as an integer numerator over an integer denominator. The shipped loader divides them into a double the moment it reads them -- one line, reading as entirely correct -- and the compliance module then scales in floating point. A rate such as 69/100 has no exact binary form, so that single division yields a rate fractionally under the filed one, before any multiplication or rounding happens. The consequence is invisible on almost every input and decides the answer exactly where the true product lands on a half, which is precisely where rounding half up is supposed to round up. Two bundled filings on JP/D sit on that boundary, so the defect is discoverable rather than hidden: a naive build reports a threshold of 3588890548 where the fixture records 3588890549, and calls a filing one cent under the threshold reportable. What makes it hard is that the natural way to check the fix reproduces it. Python floats and C doubles are both IEEE-754 binary64, so an agent that writes a Python oracle, generates its own probe rows and compares against its C gets total agreement -- on the wrong number -- and reports high confidence. Nor does the obvious repair work: the held-out rules err in the opposite direction, so no epsilon of either sign satisfies both, and widening the arithmetic that follows cannot help because the loss already happened when the ratio became a double. The fix has to be structural, keeping the rate as a ratio and settling the product onto a whole cent in integers. Around that sit two further conditions that cannot be diagnosed from one another. A filing carrying both the retail and cross-border flags is adjusted twice, settling on a whole cent each time, rather than once by the product of the two rates -- and on the held-out CA/D rule the wrong composition and the binary rate produce the identical wrong integer, so a failure there says nothing about which of the two is wrong and fixing either alone still fails. Separately the registry is a real one: hundreds of thousands of filers and issuer-specific rules, where the shipped loader stops at a compile-time ceiling and silently drops the rest, and where an override is identified by issuer, jurisdiction and transaction type together, so an index built on any two of the three bisects to a real row of the same filer carrying a different threshold. One filer far down the registry files under a rate schedule of its own, so reaching it needs the storage fixed and answering it needs the arithmetic fixed. Two further defects sit outside the arithmetic entirely. The response writer places a database-sourced field directly into the JSON body without escaping it, so a registered name carrying a quote or a backslash -- an ordinary thing for a real legal-entity name to hold -- produces a body that is not valid JSON at all; only a name that actually contains one surfaces it. And the loader normalizes an incoming filing's case but never the reference data's own, so a jurisdiction, transaction type, or issuer code stored in lowercase never matches the uppercased key a wire filing always presents, even though instruction.md already states that case is a notational variant across the system rather than a wire-only one; a filer's own override, on their own database, simply never resolves. The data is synthetic, but rates filed as ratios, per-jurisdiction thresholds, retail and cross-border adjustments and issuer-specific overrides are what currency-transaction and cross-border reporting regimes actually look like, and a one-cent error in a reportability threshold is a real regulatory defect rather than a puzzle. That is why this is categorized as Operations/Compliance rather than Software: succeeding requires reconstructing genuine compliance-reporting domain logic -- which columns decide exemption and reportability, how a rate schedule composes retail and cross-border adjustments in sequence, how an amended override resolves against a filing's own date, what a checksum must canonicalize for audit integrity -- entirely from regulatory-style evidence (the reference database's schema and the accepted filings it certifies), the way a compliance engineer would work from a rule book and a filing register. C and SQLite are the implementation vehicle that expresses that reconstructed domain logic correctly; they are not themselves the subject the agent has to reason about, and an agent that treats this as generic backend debugging without engaging the regulatory semantics will get the arithmetic composition order, the override precedence, and the exemption logic wrong. A fifteenth defect sits above all of these and is the hardest thing in the task: an issuer's override can be amended, carrying more than one row for the same issuer, jurisdiction and transaction type, distinguished by an effective_from date, and the version in force for a filing is the one with the latest effective_from on or before the filing's own date, falling back to the generic rule when none has started yet. The shipped loader reads the new column but never consults it when choosing among same-keyed rows, resolving deterministically to whichever version it encounters first regardless of the filing's date -- correct only by coincidence, for filings that happen to fall in that same era. Fixing it touches the schema, the load path, the lookup path and the decision path together, since the lookup now needs the filing's own date threaded through a signature that never carried it before, and at least one pair of historical versions is built so their rates only diverge from each other at a rounding-half boundary, meaning the date resolution and the rate arithmetic must both be right at once. An agent that spot-checks only against the single-version examples already in the bundled fixture sees every one of them pass and gains false confidence, because those examples were never amended and cannot exercise the defect at all."
solution_explanation = "The reference implementation repairs the wire, reference-data and compliance modules together. Field trimming strips both leading and trailing whitespace; a parenthesised amount is negative the same way a leading minus sign is; the checksum canonicalisation includes the flags byte alongside the other five normalised fields. The loader sizes each table from the database instead of a compile-time ceiling, allocating to fit and sorting each on its full key, and the override lookup matches issuer code, jurisdiction and transaction type together, returning no override at all when the issuer holds none rather than falling back to another issuer's row. Rates are kept as the ratios they are filed as: the struct carries a numerator and a denominator, and a single helper computes threshold * num / den settled onto a whole cent by rounding half up, entirely in integers, so the ratio is never collapsed into a binary floating-point value. The decision applies that helper once for the retail flag and again for the cross-border flag, so a filing carrying both is adjusted in two settled steps. Threshold and both rates come from the issuer override when one applies and from the generic rule when none does, never mixed. Exemption is issuer-level OR filing-level, and a filing is reportable when manual review is flagged or when it is not exempt and the absolute amount meets or exceeds the effective threshold. The oracle rebuilds the sources with the project's own Makefile and runs the binary against the bundled database, so nothing is hardcoded to any one filing. The JSON writer escapes every string field it places into a response, so a registered name containing a quote or a backslash still produces a valid response body. The loader also upper-cases jurisdiction, transaction type, and issuer code as it reads each table, exactly as the wire parser already does to an incoming filing, so a database that stores any of them in lowercase still resolves against an incoming filing's uppercased fields. An override row also carries an effective_from date, and the composite key an override is sorted and searched on widens to include it; resolving one is a predecessor search over that full sort order for (issuer_code, jurisdiction, txn_type, filing_date), taking the last row not greater than the query, then confirming that row still shares the requested issuer, jurisdiction and transaction type before returning it -- if it does not, either no version of that override has started yet or the issuer holds none at all, and the caller falls through to the generic rule exactly as it already does when no override matches. The filing's own date is threaded from the decision module into this lookup, reusing a field already parsed out of every wire record rather than adding anything to the wire format or the response."
verification_explanation = "The separate verifier container copies the agent's built binary, reference database and source tree out of /app and exercises the running service over HTTP rather than reading source. Rule-derived expected values (thresholds, scaled amounts, registry resolution) are recomputed at test time from the same rules the fixture documents, in exact integer arithmetic, rather than read from a fixed answer table; the bundled sample_filings rows are checked separately, directly against the accepted_fragments values instruction.md names as their specification, across all 31 bundled samples rather than a handful. Two freshly synthesised databases the binary has never seen carry rules chosen to separate specific mistakes: one whose cross-border rate has no exact binary form and errs in the opposite direction to the bundled fixture, so that no single nudge satisfies both; and one where adjusting once by the product of two rates and adjusting stepwise through binary rates land on the same wrong cent, so neither mistake can be inferred from the other. The registry checks resolve filers on both sides of any plausible fixed ceiling and assert that each of a filer's four override rows returns its own threshold, so an index keyed on part of the composite key lands on a real row with a wrong number and is caught. Further checks confirm the binary links against nothing but libc and SQLite by reading its ELF headers, confirm the reference database is left completely unchanged (compared table-by-table, independent of row storage order), confirm reportability is monotonic as an amount crosses a threshold across seven issuer/jurisdiction combinations, and confirm a fresh instance reproduces the session instance's answers exactly. The agent-produced binary is always launched with its privileges dropped to an unprivileged uid via subprocess's own user/group arguments, so it never has write access to the verifier's reward channel. A third held-out database exercises two further defects unrelated to the rate arithmetic: one registered name carries a literal quote and backslash, which only a properly escaping response writer can round-trip as valid JSON; and an issuer code, a generic rule, and that issuer's own override are all stored in lowercase, which only a loader that case-folds the reference data as it reads it can resolve against a wire filing's already-uppercased fields. The fifteenth, temporal-override defect is exercised on three separate fronts: a bundled issuer whose override has been amended twice, probed at seven exact era boundaries plus arbitrarily early dates; a fourth and a sixth held-out database, one carrying several issuers with their own amendment histories including a lowercase-stored one that entangles case-folding with date resolution, and rates chosen so the rate-as-ratio trap and the date-resolution trap must both be solved at once; and a filer well into the generated override population whose override is itself amended, proving the fix generalises past a handful of named issuers. Every one of these is checked from both sides of its date and rate boundaries, so a partial fix that only gets the date or only gets the arithmetic right still fails, and every defect, including the fourteen that predate this one, was confirmed in isolation by reintroducing it alone into an otherwise-correct build and checking the failure set is real and attributable to it. No test asserts an exact ordering of JSON object keys -- every body comparison parses the response and compares by field name or as a whole dict, which is order-independent by construction; the escaping checks similarly only confirm a name containing a quote, backslash, control character, or multi-byte Unicode still parses as valid JSON and round-trips to the exact original string, a direct consequence of the wire contract's own commitment to returning decoded JSON rather than an inferred rule, and the case-folding checks trace to instruction.md's own statement that case is a notational variant including when matching against reference data. The six held-out topology databases are not a combinatorial sweep: each isolates one condition a real registry can present -- scale, multi-jurisdiction overrides on one issuer, case-variant reference data, embedded special characters, a stepwise negative-amount composition, and amended overrides -- and the flag-composition matrix itself runs its full combination set only against the seven rule-table rows whose rate has no exact binary form, since those are the only rows where the float-collapse defect is distinguishable from correct rational arithmetic; the other twelve rows get a single existence check across every row instead of the full matrix. The suite totals exactly 386 test cases; the verifier writes a binary 0 or 1 to reward.txt from pytest's own exit code."

[verifier]
timeout_sec = 1800
environment_mode = "separate"
network_mode = "no-network"

[agent]
timeout_sec = 5400
network_mode = "no-network"

[environment]
build_timeout_sec = 1200
cpus = 2
memory_mb = 8192
storage_mb = 10240
network_mode = "public"
